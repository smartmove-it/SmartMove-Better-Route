<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        SmartMove – Better Route
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- Navigation Bar -->

    <header class="navbar">

        <div class="brand">
            Smart<span>Move</span>
        </div>

        <nav>

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('admin') }}">
                Admin
            </a>

        </nav>

    </header>


    <!-- Flash Messages -->

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            <div class="flash">

                {{ messages[0] }}

            </div>

        {% endif %}

    {% endwith %}


    <!-- Main Content -->

    <main>

        {% block content %}

        {% endblock %}

    </main>


    <!-- Footer -->

    <footer>

        <p>
            SmartMove – Better Route |
            Community Enhancement IT Project
        </p>

    </footer>

</body>

</html>
